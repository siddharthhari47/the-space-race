<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side view illustration of a commercial twin-engine airliner">
  <defs>
    <linearGradient id="acBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="acBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#dfe7ef"/>
      <stop offset="100%" stop-color="#8592a3"/>
    </linearGradient>
    <linearGradient id="acWingTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="acWingBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#5c6b81"/>
    </linearGradient>
    <linearGradient id="acStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="acEngine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="fuselageClip">
      <path d="M150,185 Q150,145 260,143 L760,148 Q840,150 895,180 Q840,210 760,212 L260,217 Q150,217 150,185 Z"/>
    </clipPath>
  </defs>

  <rect width="1000" height="400" fill="url(#acBg)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="180" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="320" cy="70" r="1.3" opacity="0.75"/>
    <circle cx="640" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="760" cy="35" r="1" opacity="0.6"/>
    <circle cx="900" cy="65" r="1.3" opacity="0.75"/>
    <circle cx="950" cy="100" r="1" opacity="0.55"/>
    <circle cx="50" cy="120" r="1" opacity="0.5"/>
  </g>

  <!-- horizontal stabilizer (tail wing) -->
  <polygon points="790,192 862,197 848,212 800,210" fill="url(#acWingTop)" stroke="#475569" stroke-width="2"/>

  <!-- vertical stabilizer (tail fin), painted like a real airline tail -->
  <polygon points="818,150 878,148 862,182 812,182" fill="url(#acStripe)" stroke="#0f766e" stroke-width="2"/>
  <circle cx="843" cy="167" r="9" fill="#05070f" opacity="0.85"/>
  <circle cx="843" cy="167" r="5" fill="#5eead4"/>

  <!-- main wing, two-tone upper/lower surface -->
  <polygon points="420,203 600,292 553,317 458,236" fill="url(#acWingTop)" stroke="#475569" stroke-width="2"/>
  <polygon points="458,236 553,317 553,323 452,242" fill="url(#acWingBottom)"/>

  <!-- winglet -->
  <polygon points="598,289 613,254 621,257 607,293" fill="url(#acWingTop)" stroke="#475569" stroke-width="1.5"/>

  <!-- engine pylon + nacelle -->
  <rect x="462" y="234" width="10" height="34" fill="#475569"/>
  <ellipse cx="470" cy="270" rx="40" ry="20" fill="url(#acEngine)" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="452" cy="270" rx="12" ry="16" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
  <path d="M444,262 A 14 14 0 0 1 444,278" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.6"/>

  <!-- landing gear -->
  <line x1="486" y1="308" x2="486" y2="336" stroke="#64748b" stroke-width="3"/>
  <circle cx="486" cy="342" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <line x1="232" y1="213" x2="232" y2="236" stroke="#64748b" stroke-width="3"/>
  <circle cx="232" cy="242" r="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- fuselage body + livery, clipped to the fuselage silhouette -->
  <g clip-path="url(#fuselageClip)">
    <path d="M150,185 Q150,145 260,143 L760,148 Q840,150 895,180 Q840,210 760,212 L260,217 Q150,217 150,185 Z" fill="url(#acBody)"/>
    <rect x="130" y="149" width="780" height="4" fill="#ffffff" opacity="0.35"/>
    <rect x="130" y="192" width="780" height="15" fill="url(#acStripe)"/>
    <ellipse cx="172" cy="163" rx="22" ry="9" fill="#ffffff" opacity="0.18"/>
  </g>
  <path d="M150,185 Q150,145 260,143 L760,148 Q840,150 895,180 Q840,210 760,212 L260,217 Q150,217 150,185 Z"
        fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- cockpit window -->
  <rect x="182" y="156" width="46" height="17" rx="8" fill="#0f172a" opacity="0.9"/>

  <!-- passenger windows -->
  <g fill="#0f172a" opacity="0.55">
    <circle cx="270" cy="178" r="4"/>
    <circle cx="293" cy="178" r="4"/>
    <circle cx="316" cy="178" r="4"/>
    <circle cx="339" cy="178" r="4"/>
    <circle cx="362" cy="178" r="4"/>
    <circle cx="385" cy="178" r="4"/>
    <circle cx="600" cy="178" r="4"/>
    <circle cx="623" cy="178" r="4"/>
    <circle cx="646" cy="178" r="4"/>
    <circle cx="669" cy="178" r="4"/>
    <circle cx="692" cy="178" r="4"/>
    <circle cx="715" cy="178" r="4"/>
    <circle cx="738" cy="178" r="4"/>
  </g>

  <!-- pitot tube -->
  <line x1="152" y1="181" x2="130" y2="179" stroke="#5eead4" stroke-width="2"/>

  <!-- static port -->
  <circle cx="250" cy="196" r="3.5" fill="#fb923c"/>
</svg>
