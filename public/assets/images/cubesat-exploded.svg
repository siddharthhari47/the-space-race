<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exploded view of a 1U CubeSat's internal layers">
  <defs>
    <linearGradient id="exBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="exPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="exFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" fill="url(#exBg)"/>

  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="40" r="1.3"/>
    <circle cx="430" cy="60" r="1.1"/>
    <circle cx="80" cy="650" r="1.2"/>
    <circle cx="420" cy="640" r="1"/>
    <circle cx="440" cy="300" r="1.2"/>
    <circle cx="50" cy="400" r="1"/>
  </g>

  <!-- assembly axis -->
  <line x1="250" y1="55" x2="250" y2="560" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- antenna -->
  <line x1="250" y1="55" x2="250" y2="30" stroke="#5eead4" stroke-width="2"/>
  <line x1="250" y1="30" x2="225" y2="15" stroke="#5eead4" stroke-width="2"/>
  <line x1="250" y1="30" x2="275" y2="15" stroke="#5eead4" stroke-width="2"/>
  <circle cx="250" cy="30" r="4" fill="#fb923c"/>

  <!-- solar panel (top skin) -->
  <rect x="110" y="90" width="280" height="36" rx="6" fill="url(#exPanel)" stroke="#0f766e" stroke-width="2"/>
  <g stroke="#0f766e" stroke-width="1" opacity="0.8">
    <line x1="150" y1="90" x2="150" y2="126"/>
    <line x1="190" y1="90" x2="190" y2="126"/>
    <line x1="230" y1="90" x2="230" y2="126"/>
    <line x1="270" y1="90" x2="270" y2="126"/>
    <line x1="310" y1="90" x2="310" y2="126"/>
    <line x1="350" y1="90" x2="350" y2="126"/>
  </g>

  <!-- OBC / comms board -->
  <rect x="120" y="170" width="260" height="36" rx="6" fill="#0f2f2b" stroke="#134e4a" stroke-width="2"/>
  <g fill="#134e4a">
    <rect x="140" y="180" width="18" height="16" rx="2"/>
    <rect x="170" y="180" width="28" height="16" rx="2"/>
    <rect x="210" y="180" width="14" height="16" rx="2"/>
    <rect x="320" y="180" width="40" height="16" rx="2"/>
  </g>

  <!-- ADCS module -->
  <rect x="140" y="250" width="220" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="268" r="12" fill="#334155" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="300" cy="268" r="12" fill="#334155" stroke="#a78bfa" stroke-width="2"/>

  <!-- payload / sensor -->
  <rect x="155" y="330" width="190" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="250" cy="348" r="13" fill="#0f172a" stroke="#fb923c" stroke-width="2.5"/>
  <circle cx="250" cy="348" r="5" fill="#fb923c" opacity="0.85"/>

  <!-- battery -->
  <rect x="170" y="410" width="160" height="36" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="205" y1="410" x2="205" y2="446"/>
    <line x1="240" y1="410" x2="240" y2="446"/>
    <line x1="275" y1="410" x2="275" y2="446"/>
    <line x1="310" y1="410" x2="310" y2="446"/>
  </g>

  <!-- structure / frame + bottom skin -->
  <rect x="95" y="488" width="310" height="52" rx="8" fill="url(#exFrame)" stroke="#64748b" stroke-width="2"/>
  <rect x="120" y="502" width="60" height="24" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="220" y="502" width="60" height="24" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="320" y="502" width="60" height="24" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
</svg>
